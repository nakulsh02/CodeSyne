

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Card</title>

<style>
*{
    margin:0;
        padding:0;
            box-sizing:border-box;
                font-family:Arial, Helvetica, sans-serif;
                }

                body{
                    display:flex;
                        justify-content:center;
                            align-items:center;
                                min-height:100vh;
                                    background:linear-gradient(135deg,#4f46e5,#06b6d4);
                                    }

                                    .card{
                                        width:340px;
                                            background:rgba(255,255,255,0.15);
                                                backdrop-filter:blur(15px);
                                                    border:1px solid rgba(255,255,255,0.3);
                                                        border-radius:20px;
                                                            padding:30px;
                                                                text-align:center;
                                                                    color:#fff;
                                                                        box-shadow:0 15px 35px rgba(0,0,0,.25);
                                                                            transition:.4s;
                                                                            }

                                                                            .card:hover{
                                                                                transform:translateY(-10px);
                                                                                    box-shadow:0 20px 45px rgba(0,0,0,.35);
                                                                                    }

                                                                                    h1{
                                                                                        font-size:2rem;
                                                                                            margin-bottom:10px;
                                                                                            }

                                                                                            p{
                                                                                                opacity:.9;
                                                                                                    margin-bottom:25px;
                                                                                                        line-height:1.6;
                                                                                                        }

                                                                                                        button{
                                                                                                            background:#fff;
                                                                                                                color:#4f46e5;
                                                                                                                    border:none;
                                                                                                                        padding:12px 28px;
                                                                                                                            border-radius:50px;
                                                                                                                                font-size:16px;
                                                                                                                                    font-weight:bold;
                                                                                                                                        cursor:pointer;
                                                                                                                                            transition:.3s;
                                                                                                                                            }

                                                                                                                                            button:hover{
                                                                                                                                                background:#4f46e5;
                                                                                                                                                    color:#fff;
                                                                                                                                                        transform:scale(1.05);
                                                                                                                                                        }
                                                                                                                                                        </style>

                                                                                                                                                        </head>
                                                                                                                                                        <body>

                                                                                                                                                        <div class="card">
                                                                                                                                                            <h1>Hello, Nakul 👋</h1>
                                                                                                                                                                <p>
                                                                                                                                                                        Welcome to your beautiful HTML & CSS page.
                                                                                                                                                                                This card has a modern glassmorphism design with smooth hover effects.
                                                                                                                                                                                    </p>

                                                                                                                                                                                        <button onclick="alert('Welcome! 🚀')">
                                                                                                                                                                                                Click Me
                                                                                                                                                                                                    </button>
                                                                                                                                                                                                    </div>

                                                                                                                                                                                                    </body>
                                                                                                                                                                                                    </html>
