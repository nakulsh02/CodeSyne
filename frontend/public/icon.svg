<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Ultra HD 4K Pure Vector Deep Cosmic Canvas Background -->
    <linearGradient id="hdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070518"/>
      <stop offset="50%" stop-color="#0f0b2e"/>
      <stop offset="100%" stop-color="#1a1344"/>
    </linearGradient>

    <!-- Vibrant High-Contrast Crystal-Clear Vector Gradient for Code Emblem (< / >) -->
    <linearGradient id="hdCode" gradientUnits="userSpaceOnUse" x1="50" y1="100" x2="460" y2="410">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Subtle Pure Vector Radial Glow -->
    <radialGradient id="hdGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Vector Squircle Canvas Container (No raster/bitmap layers) -->
  <rect width="512" height="512" rx="112" fill="url(#hdBg)"/>

  <!-- Core Ambient Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="url(#hdGlow)"/>

  <!-- 100% Pure Vector Code Symbol (< / >) - Professional Scaled with Perfect Circular Safe Zone -->
  <g transform="matrix(0.82 0 0 0.82 46.08 46.08)" fill="none" stroke="url(#hdCode)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Angle Bracket (<) -->
    <path d="M 165 168 L 82 256 L 165 344"/>
    <!-- Right Angle Bracket (>) -->
    <path d="M 347 168 L 430 256 L 347 344"/>
    <!-- Center Code Slash (/) -->
    <path d="M 292 138 L 220 374"/>
  </g>
</svg>
